[options]
; ==============================================================================
; Odoo 20 Private Repository - Configuration Template
;
; The container entrypoint renders environment values into /tmp/odoo.conf.
; Keep secrets in the untracked .env file, not in this configuration.
; ==============================================================================
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_port = 5432
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
; Single-database mode. When set, /odoo loads the database directly instead of
; redirecting to /web/database/selector, which list_db = False disables.
db_name = ${ODOO_DB_NAME}
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

list_db = False
proxy_mode = True
; Odoo binds to loopback by default, which makes published ports unreachable.
http_interface = 0.0.0.0

; Logging
log_level = info
log_handler = :INFO

; Resource limits
workers = 3
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
